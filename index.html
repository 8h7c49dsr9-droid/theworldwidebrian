<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strip Reader">
<title>Strip Reader</title>
<style>
  :root {
    --bg: #141210;
    --panel: #1c1916;
    --panel-line: #2c2822;
    --ink: #ece7dc;
    --ink-dim: #a89f8f;
    --stamp: #b8863b;
    --stamp-dim: #8a6a30;
    --danger: #a8493d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ---------- Chooser screen ---------- */
  #chooser {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 40px; text-align: center;
  }
  #chooser h1 {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 15px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--stamp); margin: 0 0 4px;
  }
  #chooser p { color: var(--ink-dim); font-size: 14px; max-width: 340px; line-height: 1.5; margin: 0; }
  .btn {
    appearance: none; border: 1px solid var(--stamp-dim); background: var(--panel);
    color: var(--ink); font-size: 15px; padding: 12px 22px; border-radius: 8px;
    font-family: inherit; cursor: pointer;
  }
  .btn:active { background: var(--panel-line); }
  .btn-primary { border-color: var(--stamp); background: var(--stamp-dim); color: #17140f; font-weight: 600; }
  .btn-primary:active { background: var(--stamp); }
  #folderInput { display: none; }

  /* ---------- Top bar ---------- */
  #topbar {
    display: none; align-items: center; justify-content: space-between;
    padding: 10px 12px; background: var(--panel); border-bottom: 1px solid var(--panel-line);
    z-index: 10;
  }
  #topbar.show { display: flex; }
  .icon-btn {
    appearance: none; border: none; background: transparent; color: var(--ink-dim);
    font-size: 20px; padding: 6px 10px; border-radius: 6px; cursor: pointer;
  }
  .icon-btn:active { background: var(--panel-line); color: var(--ink); }
  .icon-btn.active { color: var(--stamp); }
  #titleLabel {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px;
    letter-spacing: 0.08em; color: var(--ink-dim); text-transform: uppercase;
  }

  /* ---------- Viewer ---------- */
  #viewer {
    flex: 1; position: relative; overflow: hidden; background: #f4f1e9;
    touch-action: none; display: none;
  }
  #viewer.show { display: block; }
  #stage {
    position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform;
  }
  #stage.settling { transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1); }
  #stage img { display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  #tapzones { position: absolute; inset: 0; display: flex; z-index: 3; pointer-events: none; }
  #tapzones .zone { flex: 1; }
  #tapzones .zone.mid { flex: 3; }

  #loadingMsg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #7a7263; font-size: 14px; z-index: 5; pointer-events: none;
  }

  /* ---------- Bottom stamp bar ---------- */
  #stampbar {
    display: none; align-items: center; justify-content: space-between;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: var(--panel);
    border-top: 1px solid var(--panel-line); font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 12px; color: var(--ink-dim); z-index: 10;
  }
  #stampbar.show { display: flex; }
  #stampbar .date { color: var(--stamp); }
  #stampbar .count { letter-spacing: 0.04em; }

  /* ---------- Bookmarks drawer ---------- */
  #drawer {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(0,0,0,0.5);
  }
  #drawer.show { display: block; }
  #drawerPanel {
    position: absolute; right: 0; top: 0; bottom: 0; width: min(340px, 86vw);
    background: var(--panel); border-left: 1px solid var(--panel-line);
    display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  #drawerHead {
    padding: 16px 16px 10px; border-bottom: 1px solid var(--panel-line);
    display: flex; align-items: center; justify-content: space-between;
  }
  #drawerHead h2 { font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--stamp); margin: 0; }
  #bookmarkList { flex: 1; overflow-y: auto; padding: 6px 0; }
  .bm-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 16px; border-bottom: 1px solid var(--panel-line); cursor: pointer;
  }
  .bm-item:active { background: var(--panel-line); }
  .bm-item .bm-info { display: flex; flex-direction: column; gap: 2px; }
  .bm-item .bm-date { font-size: 14px; color: var(--ink); }
  .bm-item .bm-path { font-family: ui-monospace, monospace; font-size: 11px; color: var(--ink-dim); }
  .bm-remove { color: var(--danger); font-size: 13px; padding: 4px 8px; }
  #emptyBookmarks { padding: 24px 16px; color: var(--ink-dim); font-size: 13px; line-height: 1.5; }

  /* ---------- Help toast ---------- */
  #helpToast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: rgba(28,25,22,0.95); border: 1px solid var(--panel-line); color: var(--ink);
    padding: 12px 16px; border-radius: 10px; font-size: 13px; max-width: 300px; text-align: center;
    line-height: 1.5; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
</style>
</head>
<body>
<div id="app">

  <div id="chooser">
    <h1>Strip Reader</h1>
    <p>Open the folder for one year of strips, select all the GIF files inside it, and choose Open.</p>
    <label class="btn btn-primary" for="folderInput">Choose Files</label>
    <input type="file" id="folderInput" multiple>
    <p id="chooserStatus" style="min-height:18px;"></p>
  </div>

  <div id="topbar">
    <button class="icon-btn" id="btnChangeFolder" title="Choose a different folder">📁</button>
    <span id="titleLabel">Strip Reader</span>
    <div>
      <button class="icon-btn" id="btnFrameMode" title="Frame by frame">🎞</button>
      <button class="icon-btn" id="btnBookmark" title="Bookmark this page">☆</button>
      <button class="icon-btn" id="btnDrawer" title="Bookmarks">☰</button>
    </div>
  </div>

  <div id="viewer">
    <div id="loadingMsg"></div>
    <div id="stage"><img id="pageImg" draggable="false"></div>
    <div id="tapzones">
      <div class="zone" id="zonePrev"></div>
      <div class="zone mid" id="zoneMid"></div>
      <div class="zone" id="zoneNext"></div>
    </div>
  </div>

  <div id="stampbar">
    <span class="date" id="stampDate">—</span>
    <span class="count" id="stampCount">—</span>
  </div>

  <div id="drawer">
    <div id="drawerPanel">
      <div id="drawerHead">
        <h2>Bookmarks</h2>
        <button class="icon-btn" id="btnCloseDrawer">✕</button>
      </div>
      <div id="bookmarkList"></div>
    </div>
  </div>

</div>

<script>
(() => {
  "use strict";

  // ---------------- State ----------------
  let files = [];              // {name, relPath, fileObj, date: Date|null}
  let currentIndex = 0;
  let urlCache = new Map();    // index -> objectURL
  const URL_WINDOW = 3;        // keep this many pages on each side alive

  let baseScaleFitWidth = 1;
  let baseScaleDetail = 1;
  let scale = 1, minScale = 1, maxScale = 1;
  let tx = 0, ty = 0;
  let zoomMode = "detail"; // "detail" (default, ~3 of 4 panels) or "overview" (whole strip)
  let naturalW = 0, naturalH = 0;
  let userZoomMultiplier = 1; // remembers pinch adjustments across pages

  let frameMode = false;
  const FRAME_COUNT = 4; // dailies are consistently 4 panels; adjust if Sundays need a different count
  let frameIndex = 0;
  let pendingFrameIndex = null; // set when navigating backward into a new page while in frame mode

  let bookmarks = [];

  // ---------------- DOM refs ----------------
  const chooser = document.getElementById("chooser");
  const chooserStatus = document.getElementById("chooserStatus");
  const folderInput = document.getElementById("folderInput");
  const topbar = document.getElementById("topbar");
  const viewer = document.getElementById("viewer");
  const stampbar = document.getElementById("stampbar");
  const stage = document.getElementById("stage");
  const pageImg = document.getElementById("pageImg");
  const loadingMsg = document.getElementById("loadingMsg");
  const stampDate = document.getElementById("stampDate");
  const stampCount = document.getElementById("stampCount");
  const btnFrameMode = document.getElementById("btnFrameMode");
  const btnBookmark = document.getElementById("btnBookmark");
  const btnDrawer = document.getElementById("btnDrawer");
  const btnCloseDrawer = document.getElementById("btnCloseDrawer");
  const btnChangeFolder = document.getElementById("btnChangeFolder");
  const drawer = document.getElementById("drawer");
  const bookmarkList = document.getElementById("bookmarkList");
  const zonePrev = document.getElementById("zonePrev");
  const zoneNext = document.getElementById("zoneNext");
  const zoneMid = document.getElementById("zoneMid");

  // ---------------- Storage helpers (standard localStorage — works on any hosted page) ----------------
  function loadBookmarks() {
    try {
      const raw = localStorage.getItem("dbury-bookmarks");
      bookmarks = raw ? JSON.parse(raw) : [];
    } catch (e) { bookmarks = []; }
  }
  function saveBookmarks() {
    try { localStorage.setItem("dbury-bookmarks", JSON.stringify(bookmarks)); }
    catch (e) { console.error("Could not save bookmarks", e); }
  }
  function loadLastPosition() {
    try { return localStorage.getItem("dbury-last-position"); }
    catch (e) { return null; }
  }
  function saveLastPosition(relPath) {
    try { localStorage.setItem("dbury-last-position", relPath); }
    catch (e) { /* non-fatal */ }
  }
  function loadZoomMultiplier() {
    try {
      const raw = localStorage.getItem("dbury-zoom-multiplier");
      const val = raw ? parseFloat(raw) : 1;
      return isFinite(val) && val > 0 ? val : 1;
    } catch (e) { return 1; }
  }
  function saveZoomMultiplier() {
    try { localStorage.setItem("dbury-zoom-multiplier", String(userZoomMultiplier)); }
    catch (e) { /* non-fatal */ }
  }

  // ---------------- Filename date parsing ----------------
  // Matches patterns like db701026 -> Oct 26, 1970
  function parseDateFromName(name) {
    const m = name.match(/(\d{2})(\d{2})(\d{2})/);
    if (!m) return null;
    let [_, yy, mm, dd] = m;
    yy = parseInt(yy, 10); mm = parseInt(mm, 10); dd = parseInt(dd, 10);
    const year = yy >= 60 ? 1900 + yy : 2000 + yy;
    const d = new Date(year, mm - 1, dd);
    if (isNaN(d.getTime())) return null;
    return d;
  }
  function formatDate(d) {
    if (!d) return "—";
    return d.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  }

  // ---------------- File loading ----------------
  folderInput.addEventListener("change", async (e) => {
    const all = Array.from(e.target.files || []);
    const gifs = all.filter(f => /\.gif$/i.test(f.name));
    if (gifs.length === 0) {
      chooserStatus.textContent = "No GIF files found in that folder.";
      return;
    }
    gifs.sort((a, b) => {
      const pa = a.webkitRelativePath || a.name;
      const pb = b.webkitRelativePath || b.name;
      return pa < pb ? -1 : pa > pb ? 1 : 0;
    });
    files = gifs.map(f => ({
      name: f.name,
      relPath: f.webkitRelativePath || f.name,
      fileObj: f,
      size: f.size,
      date: parseDateFromName(f.name)
    }));
    const zeroByte = files.filter(f => f.size === 0).length;
    chooserStatus.textContent = zeroByte > 0
      ? `Loaded ${files.length} strips — warning: ${zeroByte} appear to be empty (0 bytes).`
      : `Loaded ${files.length} strips.`;

    await loadBookmarks();
    userZoomMultiplier = loadZoomMultiplier();
    const lastPath = await loadLastPosition();
    let startIndex = 0;
    if (lastPath) {
      const idx = files.findIndex(f => f.relPath === lastPath);
      if (idx >= 0) startIndex = idx;
    }

    chooser.style.display = "none";
    topbar.classList.add("show");
    viewer.classList.add("show");
    stampbar.classList.add("show");

    goToIndex(startIndex, true);
    maybeShowHelp();
  });

  btnChangeFolder.addEventListener("click", () => {
    folderInput.value = "";
    folderInput.click();
  });

  // ---------------- File data reading (FileReader, not blob URLs — more reliable across contexts) ----------------
  function readFileAsDataURL(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error || new Error("read failed"));
      reader.readAsDataURL(file);
    });
  }
  async function getUrl(i) {
    if (i < 0 || i >= files.length) return null;
    if (urlCache.has(i)) return urlCache.get(i);
    try {
      const dataUrl = await readFileAsDataURL(files[i].fileObj);
      urlCache.set(i, dataUrl);
      return dataUrl;
    } catch (e) {
      return null;
    }
  }
  function pruneUrls() {
    for (const i of Array.from(urlCache.keys())) {
      if (Math.abs(i - currentIndex) > URL_WINDOW) urlCache.delete(i);
    }
  }
  function prefetchNeighbors() {
    for (let d = 1; d <= URL_WINDOW; d++) { getUrl(currentIndex + d); getUrl(currentIndex - d); }
  }

  // ---------------- Rendering / navigation ----------------
  async function goToIndex(i, immediate) {
    if (i < 0 || i >= files.length) return;
    currentIndex = i;
    const entry = files[i];
    loadingMsg.textContent = "Loading…";
    stampDate.textContent = formatDate(entry.date);
    stampCount.textContent = `${i + 1} / ${files.length}`;
    btnBookmark.classList.toggle("active", isBookmarked(entry.relPath));
    btnBookmark.textContent = isBookmarked(entry.relPath) ? "★" : "☆";

    const url = await getUrl(i);
    if (currentIndex !== i) return; // user navigated again before this resolved
    if (!url) {
      loadingMsg.textContent = `Couldn't read "${entry.name}" from this device.`;
      return;
    }
    pageImg.onload = () => {
      loadingMsg.textContent = "";
      naturalW = pageImg.naturalWidth;
      naturalH = pageImg.naturalHeight;
      computeScales();
      if (frameMode) {
        frameIndex = pendingFrameIndex !== null ? pendingFrameIndex : 0;
        pendingFrameIndex = null;
        layoutFrame(immediate);
      } else {
        setZoomMode(zoomMode, immediate);
      }
    };
    pageImg.onerror = () => {
      loadingMsg.textContent = `Couldn't decode "${entry.name}" as an image.`;
    };
    pageImg.src = url;

    prefetchNeighbors();
    pruneUrls();
    saveLastPosition(entry.relPath);
  }

  let cachedRect = null;
  function viewerSize() {
    if (cachedRect) return { w: cachedRect.width, h: cachedRect.height };
    const r = viewer.getBoundingClientRect();
    return { w: r.width, h: r.height };
  }

  function computeScales() {
    const { w, h } = viewerSize();
    if (!naturalW || !naturalH) return;
    baseScaleFitWidth = w / naturalW;
    baseScaleDetail = baseScaleFitWidth * 1.35; // ~74% of strip width visible ≈ 3 of 4 panels
    minScale = baseScaleFitWidth * 0.95;
    maxScale = baseScaleDetail * 3;
  }

  function clampPan() {
    const { w, h } = viewerSize();
    const imgW = naturalW * scale, imgH = naturalH * scale;
    const minTx = Math.min(0, w - imgW), maxTx = 0;
    const minTy = Math.min(0, h - imgH), maxTy = 0;
    tx = Math.max(minTx, Math.min(maxTx, tx));
    ty = Math.max(minTy, Math.min(maxTy, ty));
    // center if image smaller than viewport on an axis
    if (imgW < w) tx = (w - imgW) / 2;
    if (imgH < h) ty = (h - imgH) / 2;
  }

  function applyTransform() {
    stage.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${scale})`;
  }

  function setZoomMode(mode, immediate) {
    zoomMode = mode;
    scale = mode === "overview"
      ? baseScaleFitWidth
      : Math.max(minScale, Math.min(maxScale, baseScaleDetail * userZoomMultiplier));
    tx = 0;
    ty = 0;
    clampPan();
    if (!immediate) stage.classList.add("settling");
    applyTransform();
  }

  function toggleZoomMode() {
    setZoomMode(zoomMode === "detail" ? "overview" : "detail");
  }

  // ---------------- Frame-by-frame mode ----------------
  function layoutFrame(immediate) {
    const { w, h } = viewerSize();
    if (!naturalW || !naturalH) return;
    const sliceW = naturalW / FRAME_COUNT;
    scale = w / sliceW;
    tx = -(frameIndex * sliceW * scale);
    const imgH = naturalH * scale;
    ty = (h - imgH) / 2;
    if (!immediate) stage.classList.add("settling");
    applyTransform();
  }

  function enterFrameMode() {
    frameMode = true;
    frameIndex = 0;
    btnFrameMode.classList.add("active");
    layoutFrame(false);
  }

  function exitFrameMode() {
    frameMode = false;
    btnFrameMode.classList.remove("active");
    setZoomMode(zoomMode, false);
  }

  function toggleFrameMode() {
    if (frameMode) exitFrameMode(); else enterFrameMode();
  }
  btnFrameMode.addEventListener("click", toggleFrameMode);

  function nextFrame() {
    if (frameIndex < FRAME_COUNT - 1) {
      frameIndex++;
      layoutFrame(false);
    } else {
      goToIndex(currentIndex + 1);
    }
  }
  function prevFrame() {
    if (frameIndex > 0) {
      frameIndex--;
      layoutFrame(false);
    } else {
      pendingFrameIndex = FRAME_COUNT - 1;
      goToIndex(currentIndex - 1);
    }
  }

  window.addEventListener("resize", () => {
    computeScales();
    if (frameMode) layoutFrame(true); else { clampPan(); applyTransform(); }
  });

  // ---------------- Pointer gestures ----------------
  let pointers = new Map();
  let gestureStartDist = 0, gestureStartScale = 1;
  let dragStart = null;       // {x,y,tx,ty}
  let dragMoved = false;

  function dist(p1, p2) { return Math.hypot(p1.x - p2.x, p1.y - p2.y); }

  let gestureIsPinch = false;
  let rafPending = false;

  viewer.addEventListener("pointerdown", (e) => {
    viewer.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    cachedRect = viewer.getBoundingClientRect();
    stage.classList.remove("settling");
    if (pointers.size === 1) {
      dragStart = { x: e.clientX, y: e.clientY, tx, ty };
      dragMoved = false;
      gestureIsPinch = false;
    } else if (pointers.size === 2) {
      gestureIsPinch = true;
      const pts = Array.from(pointers.values());
      gestureStartDist = dist(pts[0], pts[1]);
      gestureStartScale = scale;
    }
  });

  viewer.addEventListener("pointermove", (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (frameMode) return; // frame mode only responds to taps, not drag/pinch

    if (pointers.size === 2) {
      const pts = Array.from(pointers.values());
      const d = dist(pts[0], pts[1]);
      if (gestureStartDist > 0) {
        scale = Math.max(minScale, Math.min(maxScale, gestureStartScale * (d / gestureStartDist)));
        scheduleTransform();
      }
    } else if (pointers.size === 1 && dragStart) {
      const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
      if (Math.hypot(dx, dy) > 6) dragMoved = true;
      tx = dragStart.tx + dx;
      ty = dragStart.ty + dy;
      scheduleTransform();
    }
  });

  function scheduleTransform() {
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(() => {
      clampPan();
      applyTransform();
      rafPending = false;
    });
  }

  function onPointerUp(e) {
    const wasLastPointer = pointers.size === 1;
    const tapCandidate = wasLastPointer && !dragMoved && !gestureIsPinch;
    const rect = viewer.getBoundingClientRect();
    const xFrac = (e.clientX - rect.left) / rect.width;
    const pinchEnding = gestureIsPinch;

    pointers.delete(e.pointerId);
    if (pointers.size === 0) {
      if (pinchEnding && !frameMode && zoomMode === "detail") {
        userZoomMultiplier = Math.max(0.3, Math.min(3, scale / baseScaleDetail));
        saveZoomMultiplier();
      }
      dragStart = null; gestureIsPinch = false; cachedRect = null;
      stage.classList.add("settling");
      if (!frameMode) { clampPan(); applyTransform(); }
    }

    if (tapCandidate) {
      if (frameMode) {
        if (xFrac < 0.15) prevFrame();
        else if (xFrac > 0.85) nextFrame();
      } else {
        if (xFrac < 0.15) goToIndex(currentIndex - 1);
        else if (xFrac > 0.85) goToIndex(currentIndex + 1);
        else toggleZoomMode();
      }
    }
  }
  viewer.addEventListener("pointerup", onPointerUp);
  viewer.addEventListener("pointercancel", (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size === 0) { dragStart = null; gestureIsPinch = false; cachedRect = null; }
  });

  // ---------------- Keyboard (Mac testing) ----------------
  window.addEventListener("keydown", (e) => {
    if (chooser.style.display !== "none") return;
    if (e.key === "ArrowRight") { frameMode ? nextFrame() : goToIndex(currentIndex + 1); }
    else if (e.key === "ArrowLeft") { frameMode ? prevFrame() : goToIndex(currentIndex - 1); }
    else if (e.key === " ") { e.preventDefault(); if (!frameMode) toggleZoomMode(); }
    else if (e.key.toLowerCase() === "f") toggleFrameMode();
    else if (e.key.toLowerCase() === "b") toggleBookmark();
  });

  // ---------------- Bookmarks ----------------
  function isBookmarked(relPath) { return bookmarks.some(b => b.relPath === relPath); }

  function toggleBookmark() {
    const entry = files[currentIndex];
    const idx = bookmarks.findIndex(b => b.relPath === entry.relPath);
    if (idx >= 0) {
      bookmarks.splice(idx, 1);
    } else {
      bookmarks.push({ relPath: entry.relPath, name: entry.name, dateStr: formatDate(entry.date), addedAt: Date.now() });
      bookmarks.sort((a, b) => a.relPath < b.relPath ? -1 : 1);
    }
    saveBookmarks();
    btnBookmark.classList.toggle("active", isBookmarked(entry.relPath));
    btnBookmark.textContent = isBookmarked(entry.relPath) ? "★" : "☆";
    renderBookmarkList();
  }
  btnBookmark.addEventListener("click", toggleBookmark);

  function renderBookmarkList() {
    bookmarkList.innerHTML = "";
    if (bookmarks.length === 0) {
      const div = document.createElement("div");
      div.id = "emptyBookmarks";
      div.textContent = "No bookmarks yet. Tap the star while reading to save a spot.";
      bookmarkList.appendChild(div);
      return;
    }
    bookmarks.forEach(b => {
      const item = document.createElement("div");
      item.className = "bm-item";
      const info = document.createElement("div");
      info.className = "bm-info";
      const d = document.createElement("div");
      d.className = "bm-date"; d.textContent = b.dateStr || b.name;
      const p = document.createElement("div");
      p.className = "bm-path"; p.textContent = b.relPath;
      info.appendChild(d); info.appendChild(p);
      const rm = document.createElement("button");
      rm.className = "bm-remove icon-btn"; rm.textContent = "Remove";
      rm.addEventListener("click", (ev) => {
        ev.stopPropagation();
        bookmarks = bookmarks.filter(x => x.relPath !== b.relPath);
        saveBookmarks();
        renderBookmarkList();
        if (files[currentIndex] && files[currentIndex].relPath === b.relPath) {
          btnBookmark.classList.remove("active"); btnBookmark.textContent = "☆";
        }
      });
      item.appendChild(info); item.appendChild(rm);
      item.addEventListener("click", () => {
        const idx = files.findIndex(f => f.relPath === b.relPath);
        if (idx >= 0) { goToIndex(idx); drawer.classList.remove("show"); }
        else { p.textContent = b.relPath + "  (not in current folder)"; }
      });
      bookmarkList.appendChild(item);
    });
  }

  btnDrawer.addEventListener("click", () => { renderBookmarkList(); drawer.classList.add("show"); });
  btnCloseDrawer.addEventListener("click", () => drawer.classList.remove("show"));
  drawer.addEventListener("click", (e) => { if (e.target === drawer) drawer.classList.remove("show"); });

  // ---------------- First-run help ----------------
  function maybeShowHelp() {
    const toast = document.createElement("div");
    toast.id = "helpToast";
    toast.textContent = "Drag to see the last panel, tap center for the whole strip, tap the edges to turn pages. Tap 🎞 for one panel at a time.";
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4500);
  }
})();
</script>
</body>
</html>
